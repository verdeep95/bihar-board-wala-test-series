<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result • Bihar Board Wala</title><link rel="icon" href="assets/img/logo-mark.png" type="image/png"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><img class="brand-logo" src="assets/img/logo.png" alt="Bihar Board Wala" width="46" height="50"><span>Bihar Board Wala<small>Test Result</small></span></a><nav><button class="icon-btn theme-toggle" aria-label="Toggle dark mode"></button></nav></header><main id="result-app" class="container result-wrap"><div class="empty-state">Result लोड हो रहा है…</div></main><footer>© Bihar Board Wala</footer>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="assets/js/ui.js"></script><script src="assets/js/data.js"></script><script src="assets/js/math-text.js"></script>
<script>
(() => {
  const id = new URLSearchParams(location.search).get("attempt"), r = BBWData.getResult(id), app = document.querySelector("#result-app");
  if (!r) { app.innerHTML = BBWUI.errorState("Result नहीं मिला। यह दूसरे browser/device पर हो सकता है।"); return; }
  document.title = `${Math.round(r.score)}% • ${r.quizTitle}`;
  const testSlug = r.test || "test-1";
  const courseQuery = `course=${encodeURIComponent(r.course || BBWData.defaultCourse)}`;
  const chapterHref = r.chapter
    ? `chapter.html?${courseQuery}&subject=${encodeURIComponent(r.subject || "")}&chapter=${encodeURIComponent(r.chapter)}`
    : `subject.html?${courseQuery}&subject=${encodeURIComponent(r.subject || "")}`;
  const retakeHref = `test.html?${courseQuery}&subject=${encodeURIComponent(r.subject)}&chapter=${encodeURIComponent(r.chapter)}&test=${encodeURIComponent(testSlug)}`;
  app.innerHTML = `<section class="card result-hero"><span class="badge ${r.passed ? "chip good" : "chip"}">${r.passed ? "✓ Passed" : "◎ Needs practice"}</span><div style="display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap"><div><h1>${BBWUI.escape(r.quizTitle)}</h1><p class="muted">${new Date(r.submittedAt).toLocaleString("hi-IN")}</p></div><div><div class="result-score">${Math.round(r.score)}%</div><div class="muted">${r.earnedMarks}/${r.totalMarks} marks</div></div></div><div class="progress"><span style="width:${Math.min(100,r.score)}%;background:hsl(var(--${r.passed ? "success" : "warning"}))"></span></div></section><section class="stats-grid" style="margin-top:1rem">${[["Correct",`${r.correctAnswers}/${r.totalQuestions}`,"success"],["Wrong + skipped",r.wrongAnswers+r.skippedAnswers,"warning"],["Accuracy",`${Math.round(r.correctAnswers/r.totalQuestions*100)}%`,""],["Time taken",BBWUI.formatDuration(r.timeTakenSeconds),"" ]].map(x=>`<div class="card"><strong class="${x[2]}">${x[1]}</strong><small class="muted">${x[0]}</small></div>`).join("")}</section><div class="result-actions" style="margin-top:1rem"><a class="btn btn-primary" href="${retakeHref}">↻ Retake</a><button id="toggle-review" class="btn btn-outline">Review answers</button><button id="share-result" class="btn btn-ghost">↗ Share</button><a class="btn btn-ghost" href="${chapterHref}">Back to chapter</a></div><section id="review-section" hidden><div class="review-filter">${["all","correct","wrong","skipped"].map((f,i)=>`<button class="btn btn-outline ${i===0?"active":""}" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join("")}</div><div id="review-list"></div></section>`;
  const section=document.querySelector("#review-section"), list=document.querySelector("#review-list");
  function render(filter="all"){list.innerHTML=r.review.filter(x=>filter==="all"||x.status===filter).map((x,i)=>`<article class="card review-card ${x.status}"><div class="muted">Question ${i+1} • ${x.status}</div><h3>${BBWMath.render(x.question)}</h3><div class="answer-line">Your answer: ${x.selectedOption ? `${"ABCD"[x.selectedOption-1]}. ${BBWMath.render(x.options[x.selectedOption-1])}` : "Not answered"}</div><div class="answer-line success">Correct answer: ${"ABCD"[x.correctOption-1]}. ${BBWMath.render(x.options[x.correctOption-1])}</div>${x.explanation ? `<div class="explanation"><strong>Explanation</strong><div>${BBWMath.render(x.explanation)}</div></div>` : ""}</article>`).join("")||'<div class="empty-state">No questions in this filter.</div>'}
  document.querySelector("#toggle-review").onclick=()=>{section.hidden=!section.hidden;if(!section.hidden){render();section.scrollIntoView({behavior:"smooth"})}};
  document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.filter)});
  document.querySelector("#share-result").onclick=async()=>{const text=`${r.quizTitle}\nScore: ${Math.round(r.score)}% (${r.earnedMarks}/${r.totalMarks})\nCorrect: ${r.correctAnswers}/${r.totalQuestions}\n— Bihar Board Wala`;try{if(navigator.share)await navigator.share({title:r.quizTitle,text,url:location.href});else{await navigator.clipboard.writeText(text);alert("Result copied!")}}catch(e){if(e.name!=="AbortError")prompt("Copy result:",text)}};
})();
</script></body></html>
