<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Subject Tests • Bihar Board Wala</title>
  <link rel="icon" href="assets/img/logo-mark.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/img/logo.png" alt="Bihar Board Wala" width="46" height="50"><span>Bihar Board Wala<small>Class 10 Test Series</small></span></a>
    <nav><a class="btn btn-ghost" href="index.html">All subjects</a><button class="icon-btn theme-toggle" aria-label="Toggle dark mode"></button></nav>
  </header>
  <main class="container page-stack">
    <div class="breadcrumbs"><a href="index.html">Test Series</a><span>›</span><span id="crumb">Subject</span></div>
    <section id="subject-hero" class="subject-hero loading-block">Loading…</section>
    <section>
      <div class="section-heading"><div><span class="eyebrow">AVAILABLE TESTS</span><h2>अध्याय के टेस्ट</h2></div></div>
      <div id="chapter-list" class="chapter-list loading-block">Loading tests…</div>
    </section>
  </main>
  <footer>© Bihar Board Wala</footer>
  <script src="assets/js/ui.js"></script><script src="assets/js/data.js"></script>
  <script>
    (async () => {
      const slug = new URLSearchParams(location.search).get("subject");
      try {
        const manifest = await BBWData.loadManifest();
        const subject = manifest.classes[0].subjects.find(s => s.slug === slug);
        if (!subject) throw new Error("Subject नहीं मिला।");
        document.title = `${subject.name.hi} Tests • Bihar Board Wala`;
        document.querySelector("#crumb").textContent = subject.name.hi;
        const hero = document.querySelector("#subject-hero");
        hero.classList.remove("loading-block");
        const readyCount = subject.chapters.filter(c => BBWData.chapterTests(c).length > 0).length;
        hero.innerHTML = `<span class="subject-icon large">${BBWUI.subjectIcon(subject.slug)}</span><div><span class="eyebrow">CLASS 10</span><h1>${BBWUI.escape(subject.name.hi)}</h1><p>${BBWUI.escape(subject.name.en)} • ${readyCount}/${subject.chapters.length} chapters with tests</p></div>`;
        const list = document.querySelector("#chapter-list");
        list.classList.remove("loading-block");
        const sectionLabels = { gadya: "गद्य", padya: "पद्य", purak: "पूरक", prose: "Prose", poetry: "Poetry", supplementary: "Supplementary", history: "इतिहास", geography: "भूगोल", civics: "नागरिक शास्त्र", economics: "अर्थशास्त्र", disaster: "आपदा प्रबंधन" };
        list.innerHTML = subject.chapters.length ? subject.chapters.map((c, i) => {
          const tests = BBWData.chapterTests(c);
          const ready = tests.length > 0;
          const questions = BBWData.chapterQuestionCount(c);
          const section = c.section ? `<span class="chip">${BBWUI.escape(sectionLabels[c.section] || c.section)}</span> ` : "";
          const meta = ready ? `${tests.length} test${tests.length === 1 ? "" : "s"} • ${questions} questions` : "Coming soon";
          const inner = `<span class="chapter-number">${String(i + 1).padStart(2, "0")}</span><span class="chapter-info"><strong>${BBWUI.escape(c.title.hi)}</strong><small>${section}${BBWUI.escape(c.title.en)} • ${meta}</small></span><span class="btn ${ready ? "btn-outline" : "btn-ghost"}">${ready ? "View tests →" : "Soon"}</span>`;
          return ready
            ? `<a class="chapter-card" href="chapter.html?subject=${encodeURIComponent(subject.slug)}&chapter=${encodeURIComponent(c.slug)}">${inner}</a>`
            : `<div class="chapter-card is-soon" aria-disabled="true">${inner}</div>`;
        }).join("") : `<div class="empty-state"><h3>अभी कोई अध्याय नहीं है</h3><p>Admin panel से इस विषय का पहला JSON test जोड़ें।</p></div>`;
      } catch (error) {
        document.querySelector("#subject-hero").innerHTML = BBWUI.errorState(error.message);
        document.querySelector("#chapter-list").innerHTML = "";
      }
    })();
  </script>
</body>
</html>
