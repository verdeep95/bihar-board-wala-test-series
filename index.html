<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Bihar Board Wala Test Series</title>
  <link rel="icon" href="assets/img/logo-mark.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css?v=8">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html?pick=1"><img class="brand-logo" src="assets/img/logo.png" alt="Bihar Board Wala" width="46" height="50"><span>Bihar Board Wala<small>Test Series</small></span></a>
    <nav><button class="icon-btn theme-toggle" aria-label="Toggle dark mode"></button></nav>
  </header>
  <main class="container page-stack">
    <section class="pick-hero">
      <span class="eyebrow">BIHAR BOARD WALA</span>
      <h1>अपना कोर्स चुनें</h1>
      <p>जिस परीक्षा की तैयारी कर रहे हैं उसे चुनें। टेस्ट देते ही उत्तर और व्याख्या तुरंत मिलेगी।</p>
      <div class="chips" style="margin-top:.9rem">
        <span class="chip good">100% फ्री</span><span class="chip">हिन्दी + English</span><span class="chip">कोई लॉगिन नहीं</span>
      </div>
    </section>
    <section id="course-groups" class="loading-block">Loading courses…</section>
    <section id="history-section" hidden>
      <div class="section-heading"><div><span class="eyebrow">YOUR PROGRESS</span><h2>हाल के परिणाम</h2></div><button id="clear-history" class="btn btn-ghost">Clear</button></div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>
  <footer>© Bihar Board Wala • अभ्यास करें, आगे बढ़ें</footer>
  <script src="assets/js/ui.js?v=6"></script>
  <script src="assets/js/data.js"></script>
  <script>
    const redirected = (() => {
      const params = new URLSearchParams(location.search);
      if (params.get("pick") === "1") return false;
      const target = BBWData.courseParam() || BBWData.storedCourse();
      if (!target) return false;
      location.replace(`course.html?course=${encodeURIComponent(target)}`);
      return true;
    })();
    (async () => {
      if (redirected) return;
      try {
        const courses = await BBWData.loadCourses();
        if (!courses.length) throw new Error("कोई कोर्स नहीं मिला। data/manifest.json जाँचें।");
        const live = courses.filter(c => c.status !== "coming-soon");
        const soon = courses.filter(c => c.status === "coming-soon");
        const groups = [
          ["live", "AVAILABLE NOW", "Live टेस्ट सीरीज़", live],
          ["soon", "COMING SOON", "जल्द आ रहा है", soon]
        ].filter(row => row[3].length);
        const container = document.querySelector("#course-groups");
        container.classList.remove("loading-block");
        container.innerHTML = groups.map(([key, eyebrow, title, list]) => `
          <div class="course-group ${key === "live" ? "is-live" : "is-soon-group"}">
            <div class="section-heading"><div><span class="eyebrow">${eyebrow}</span><h3>${BBWUI.escape(title)}</h3></div><span class="badge badge-primary">${list.length}</span></div>
            <div class="course-grid">${list.map(c => BBWUI.courseCard(c, BBWData.courseProgress(c.slug))).join("")}</div>
          </div>`).join("");
        renderHistory(courses);
      } catch (error) {
        document.querySelector("#course-groups").classList.remove("loading-block");
        document.querySelector("#course-groups").innerHTML = BBWUI.errorState(error.message);
      }
    })();
    function renderHistory(courses) {
      const names = new Map(courses.map(c => [c.slug, BBWUI.localized(c.name, c.slug)]));
      const history = BBWData.getHistory().slice(0, 6);
      if (!history.length) return;
      document.querySelector("#history-section").hidden = false;
      document.querySelector("#history-list").innerHTML = history.map(r => `
        <a class="history-row" href="result.html?attempt=${encodeURIComponent(r.attemptId)}">
          <span class="score-mini ${r.passed ? "success" : "warning"}">${Math.round(r.score)}%</span>
          <span><strong>${BBWUI.escape(r.quizTitle)}</strong><small>${BBWUI.escape(names.get(r.course) || r.course)} • ${new Date(r.submittedAt).toLocaleDateString("hi-IN")} • ${r.correctAnswers}/${r.totalQuestions} correct</small></span>
          <span class="arrow">→</span>
        </a>`).join("");
    }
    document.querySelector("#clear-history").addEventListener("click", () => { if (confirm("सभी पुराने परिणाम हटाएँ?")) { BBWData.clearHistory(); location.reload(); } });
  </script>
  <!-- Cloudflare Web Analytics --><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "94725484981843d7bbf51b452576cf0d"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
