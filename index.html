<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Bihar Board Wala Test Series</title>
  <link rel="icon" href="assets/img/logo-mark.png" type="image/png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-logo" src="assets/img/logo.png" alt="Bihar Board Wala" width="46" height="50"><span>Bihar Board Wala<small>Class 10 Test Series</small></span></a>
    <nav><a class="btn btn-ghost admin-link" href="admin.html">Admin</a><button class="icon-btn theme-toggle" aria-label="Toggle dark mode"></button></nav>
  </header>
  <main class="container page-stack">
    <section class="hero">
      <span class="eyebrow">BIHAR BOARD • CLASS 10</span>
      <h1>तैयारी पक्की करें, एक टेस्ट के साथ</h1>
      <p>विषय चुनें, अध्याय का टेस्ट दें और तुरंत उत्तर व व्याख्या देखें।</p>
    </section>
    <section>
      <div class="section-heading"><div><span class="eyebrow">SUBJECTS</span><h2>अपना विषय चुनें</h2></div><span id="subject-count" class="badge badge-primary">6 subjects</span></div>
      <div id="subjects-grid" class="subject-grid loading-block">Loading subjects…</div>
    </section>
    <section id="history-section" hidden>
      <div class="section-heading"><div><span class="eyebrow">YOUR PROGRESS</span><h2>हाल के परिणाम</h2></div><button id="clear-history" class="btn btn-ghost">Clear</button></div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>
  <footer>© Bihar Board Wala • अभ्यास करें, आगे बढ़ें</footer>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/data.js"></script>
  <script>
    (async () => {
      try {
        const manifest = await BBWData.loadManifest();
        const subjects = manifest.classes[0].subjects;
        document.querySelector("#subject-count").textContent = `${subjects.length} subjects`;
        document.querySelector("#subjects-grid").classList.remove("loading-block");
        document.querySelector("#subjects-grid").innerHTML = subjects.map((s, i) => `
          <a class="subject-card" href="subject.html?subject=${encodeURIComponent(s.slug)}">
            <span class="subject-icon">${BBWUI.subjectIcon(s.slug)}</span>
            <div><h3>${BBWUI.escape(s.name.hi)}</h3><p>${BBWUI.escape(s.name.en)} • ${s.chapters.length} chapter${s.chapters.length === 1 ? "" : "s"}</p></div>
            <span class="arrow">→</span>
          </a>`).join("");
        renderHistory();
      } catch (error) {
        document.querySelector("#subjects-grid").innerHTML = BBWUI.errorState(error.message);
      }
    })();
    function renderHistory() {
      const history = BBWData.getHistory().slice(0, 6);
      if (!history.length) return;
      document.querySelector("#history-section").hidden = false;
      document.querySelector("#history-list").innerHTML = history.map(r => `
        <a class="history-row" href="result.html?attempt=${encodeURIComponent(r.attemptId)}">
          <span class="score-mini ${r.passed ? "success" : "warning"}">${Math.round(r.score)}%</span>
          <span><strong>${BBWUI.escape(r.quizTitle)}</strong><small>${new Date(r.submittedAt).toLocaleDateString("hi-IN")} • ${r.correctAnswers}/${r.totalQuestions} correct</small></span>
          <span class="arrow">→</span>
        </a>`).join("");
    }
    document.querySelector("#clear-history").addEventListener("click", () => { if (confirm("सभी पुराने परिणाम हटाएँ?")) { BBWData.clearHistory(); location.reload(); } });
  </script>
</body>
</html>
